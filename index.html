<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Тест отправки в бота</h1>
    <button id="testBtn">Отправить тест</button>
    <div id="status"></div>
    
    <script>
        const tg = window.Telegram?.WebApp;
        let userId = null;
        
        // Получаем user_id из URL
        const params = new URLSearchParams(window.location.search);
        userId = params.get('user_id');
        
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        document.getElementById('testBtn').onclick = function() {
            if (!tg || !userId) {
                document.getElementById('status').innerHTML = '❌ Нет подключения к боту';
                return;
            }
            
            const testData = {
                action: 'spin_result',
                user_id: userId,
                bet: 25,
                win: 100,
                balance_after: 500,
                timestamp: new Date().toISOString()
            };
            
            tg.sendData(JSON.stringify(testData));
            document.getElementById('status').innerHTML = '✅ Отправлено! Проверьте чат с ботом';
        };
        
        document.getElementById('status').innerHTML = `🟢 Готов. User ID: ${userId || 'не найден'}`;
    </script>
</body>
</html>
